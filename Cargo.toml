[workspace]
resolver = "2"
members = [
  "crates/echolocal-core",
  "crates/echolocal-engine",
  "crates/echolocal-audio",
  "crates/echolocal-macos",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["EchoLocal contributors"]

[workspace.dependencies]
echolocal-core = { path = "crates/echolocal-core" }
echolocal-engine = { path = "crates/echolocal-engine", default-features = false }
echolocal-audio = { path = "crates/echolocal-audio", default-features = false }
echolocal-macos = { path = "crates/echolocal-macos" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
